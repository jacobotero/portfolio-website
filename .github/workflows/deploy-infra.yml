name: Deploy infra

# Deliberately manual only — infra changes (S3/CloudFront/Lambda/IAM) don't
# auto-apply on every push, unlike the frontend deploy.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cdk-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g aws-cdk

      # Pinned to a commit SHA (v4.3.1), not a mutable tag, since this
      # action handles AWS credentials directly.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: cdk deploy --require-approval never
