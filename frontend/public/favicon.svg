<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0b0a12"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- A couple of stars, echoing the hero starfield. Kept faint and away
       from the letterforms so they read as texture, not clutter, at 16px. -->
  <circle cx="25" cy="7" r="1.4" fill="#a78bfa" opacity="0.9"/>
  <circle cx="6.5" cy="9" r="0.9" fill="#a78bfa" opacity="0.55"/>
  <circle cx="27" cy="24" r="0.9" fill="#a78bfa" opacity="0.45"/>
  <text x="16" y="22.5"
        text-anchor="middle"
        font-family="Outfit, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="16"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#a78bfa">JO</text>
</svg>
